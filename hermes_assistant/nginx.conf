worker_processes 1;
daemon off;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;
    gzip off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 0.0.0.0:8787 default_server;
        server_name _;

        # HA authenticates the user before Supervisor proxies Ingress traffic.
        # Never publish the native screen, VNC socket or debug port directly.
        location /browser/ {
            access_log off;
            allow 172.30.32.2;
            allow ::ffff:172.30.32.2;
            deny all;
            proxy_pass http://127.0.0.1:9010/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin "";
            proxy_set_header X-Hermes-Browser-Ingress "1";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
        }

        location /terminal/ {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            sub_filter_once off;
            sub_filter_types text/html application/javascript application/json text/javascript;
            sub_filter 'src="/terminal/' 'src="$http_x_ingress_path/terminal/';
            sub_filter 'href="/terminal/' 'href="$http_x_ingress_path/terminal/';
            sub_filter '"/terminal/' '"$http_x_ingress_path/terminal/';
        }

        location / {
            proxy_pass http://127.0.0.1:8788;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            sub_filter_once on;
            sub_filter_types text/html;
            sub_filter '</body>' '<style>.hermes-addon-tools{position:fixed;top:max(8px,env(safe-area-inset-top));right:12px;z-index:9999;font:14px system-ui,sans-serif;color:#eee}.hermes-addon-tools summary{cursor:pointer;min-height:44px;padding:12px 16px;border:1px solid #71613d;border-radius:8px;background:#29251f;box-shadow:0 2px 8px #0005}.hermes-addon-tools nav{display:flex;flex-direction:column;gap:4px;margin-top:4px;padding:6px;border:1px solid #71613d;border-radius:8px;background:#201f1d}.hermes-addon-tools a{display:block;padding:12px 16px;min-height:44px;color:#f0cd82;text-decoration:none;border-radius:6px}.hermes-addon-tools a:hover{background:#383127}@media(max-width:600px){.hermes-addon-tools{right:8px;max-width:calc(100vw - 24px)}.hermes-addon-tools summary{padding:11px 12px}}</style><details class="hermes-addon-tools"><summary>Werkzeuge</summary><nav aria-label="Hermes Add-on Werkzeuge"><a href="browser/">Browser</a><a href="terminal/">Setup-Terminal</a></nav></details></body>';
        }
    }
}
