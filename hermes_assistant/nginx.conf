worker_processes 1;
daemon off;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;
    gzip off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 0.0.0.0:8787 default_server;
        server_name _;

        location /terminal/ {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            sub_filter_once off;
            sub_filter_types text/html application/javascript application/json text/javascript;
            sub_filter 'src="/terminal/' 'src="$http_x_ingress_path/terminal/';
            sub_filter 'href="/terminal/' 'href="$http_x_ingress_path/terminal/';
            sub_filter '"/terminal/' '"$http_x_ingress_path/terminal/';
        }

        location / {
            proxy_pass http://127.0.0.1:8788;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            sub_filter_once on;
            sub_filter_types text/html;
            sub_filter '</body>' '<style>.hermes-term-btn{position:fixed;bottom:14px;right:14px;background:#D4A02E;color:#000;padding:8px 14px;border-radius:6px;text-decoration:none;font-family:-apple-system,system-ui,sans-serif;font-size:13px;font-weight:600;z-index:99999;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:transform .1s}.hermes-term-btn:hover{transform:translateY(-1px)}</style><a class="hermes-term-btn" href="terminal/" title="Open setup terminal">⌨ Setup Terminal</a></body>';
        }
    }
}
