configuration:
  timezone:
    name: Time zone
    description: IANA time zone for Hermes and scheduled tasks.
  enable_terminal:
    name: Setup terminal
    description: Show the terminal in the Hermes WebUI.
  browser_enabled:
    name: Local browser with manual takeover
    description: Uses Hermes Bot Screen with persistent Chromium and protected web access under Tools → Browser. Requires about 1–2 GB of free RAM.
  beeper_enabled:
    name: Beeper Linux Desktop
    description: Starts the existing persistent Beeper client on a separate screen under Tools → Beeper Linux. Sign-in and account linking remain manual.
  assistant_tools_enabled:
    name: Local maps and weather tools
    description: Enables directions, distances, map links and weather cards without API keys or additional setup.
  auto_update_agent:
    name: Update Hermes on start
    description: Runs hermes update when the app starts.
  auto_update_webui:
    name: Update WebUI on start
    description: Fetches the latest WebUI from the official master branch.
  auto_configure_mcp:
    name: Configure Home Assistant MCP
    description: Registers the Home Assistant MCP endpoint in Hermes.
  api_server_enabled:
    name: Hermes API server
    description: Starts the authenticated API server for JARVIS.
  api_server_key:
    name: Hermes API key
    description: Strong API key; enter the same value in JARVIS.
  desktop_backend_enabled:
    name: Hermes Desktop connection
    description: Start an authenticated Hermes serve backend for the desktop app. Set a host port for 9119/tcp under Network.
  desktop_username:
    name: Desktop username
    description: Username for the Hermes Desktop remote connection.
  desktop_password:
    name: Desktop password
    description: Password of at least 16 characters for the Hermes Desktop remote connection. Use only on a trusted LAN or VPN.
  homeassistant_token:
    name: Home Assistant token
    description: Optional custom token; blank uses the Supervisor token.
  watch_entities:
    name: Watched entities
    description: List of Home Assistant entity IDs for Hermes.
