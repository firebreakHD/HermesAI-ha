configuration:
  timezone:
    name: Time zone
    description: IANA time zone for Hermes and scheduled tasks.
  enable_terminal:
    name: Setup terminal
    description: Show the terminal in the Hermes WebUI.
  browser_enabled:
    name: Local browser with manual takeover
    description: Uses Hermes Bot Screen with persistent Chromium and protected web access under Tools → Browser. Requires about 1–2 GB of free RAM.
  beeper_enabled:
    name: Beeper Linux Desktop
    description: Starts the existing persistent Beeper client on a separate screen under Tools → Beeper Linux. Sign-in and account linking remain manual.
  assistant_tools_enabled:
    name: Local maps and weather tools
    description: Enables directions, distances, map links and weather cards without API keys or additional setup.
  auto_update_agent:
    name: Update Hermes on start
    description: Runs hermes update when the app starts.
  auto_update_webui:
    name: Update WebUI on start
    description: Fetches the latest WebUI from the official master branch.
  auto_configure_mcp:
    name: Configure Home Assistant MCP
    description: Registers the Home Assistant MCP endpoint in Hermes.
  api_server_enabled:
    name: Hermes API server
    description: Starts the authenticated API server for JARVIS.
  api_server_key:
    name: Hermes API key
    description: Strong API key; enter the same value in JARVIS.
  desktop_backend_enabled:
    name: Hermes Desktop connection
    description: Start an authenticated Hermes serve backend for the desktop app. Set a host port for 9119/tcp under Network.
  desktop_username:
    name: Desktop username
    description: Username for the Hermes Desktop remote connection.
  desktop_password:
    name: Desktop password
    description: Password of at least 16 characters for the Hermes Desktop remote connection. Use only on a trusted LAN or VPN.
  homeassistant_token:
    name: Home Assistant token
    description: Optional custom token; blank uses the Supervisor token.
  watch_entities:
    name: Watched entities
    description: List of Home Assistant entity IDs for Hermes.
  talk_enabled:
    name: JARVIS in Nextcloud Talk
    description: Enable JARVIS in authorized local one-to-one chats.
  talk_url:
    name: Nextcloud URL for both contacts
    description: Nextcloud HTTPS base URL, including the installation path if applicable.
  talk_username:
    name: JARVIS Nextcloud account ID
    description: Existing case-sensitive Nextcloud login ID.
  talk_app_password:
    name: JARVIS app password
    description: App password with file access for the existing Nextcloud account.
  talk_allowed_users:
    name: Allowed users for JARVIS
    description: Exact Nextcloud account IDs of authorized senders.
  talk_allowed_rooms:
    name: Allowed Talk rooms for JARVIS
    description: Optional room tokens. Leave empty to allow all local one-to-one chats with authorized users.
  talk_piper_endpoint:
    name: Wyoming Piper endpoint for both contacts
    description: Internal tcp://host:port address. Leave empty for text-only operation.
  talk_calls_enabled:
    name: Live calls for JARVIS and FRIDAY
    description: Answer authorized calls for enabled contacts using local Whisper and Wyoming Piper.
  talk_piper_voice:
    name: German Piper voice for JARVIS
    description: Exact Wyoming voice name, such as de_DE-thorsten-medium.
  talk_friday_enabled:
    name: FRIDAY in Nextcloud Talk
    description: Enable FRIDAY as a separate contact. Disabled by default.
  talk_friday_username:
    name: FRIDAY Nextcloud account ID
    description: Separate account ID on the same Nextcloud instance.
  talk_friday_app_password:
    name: FRIDAY app password
    description: Separate app password with file access for FRIDAY.
  talk_friday_allowed_users:
    name: Allowed users for FRIDAY
    description: Exact account IDs. Leave empty to inherit the JARVIS user list.
  talk_friday_allowed_rooms:
    name: Allowed Talk rooms for FRIDAY
    description: Optional FRIDAY room tokens. Leave empty to allow all local one-to-one chats with authorized users.
  talk_friday_piper_voice:
    name: German Piper voice for FRIDAY
    description: Exact Wyoming voice name, such as de_DE-eva_k-x_low.
