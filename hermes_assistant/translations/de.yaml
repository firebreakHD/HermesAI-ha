configuration:
  timezone:
    name: Zeitzone
    description: IANA-Zeitzone für Hermes und geplante Aufgaben.
  enable_terminal:
    name: Setup-Terminal
    description: Terminal in der Hermes WebUI anzeigen.
  browser_enabled:
    name: Lokaler Browser mit Übernahme
    description: Nutzt Hermes Bot Screen mit persistentem Chromium und abgesichertem Webzugang unter Werkzeuge → Browser. Benötigt etwa 1–2 GB freien RAM.
  assistant_tools_enabled:
    name: Lokale Karten- und Wettertools
    description: Aktiviert Wegbeschreibungen, Entfernungen, Kartenlinks und Wetterkarten ohne API-Schlüssel oder zusätzliche Einrichtung.
  auto_update_agent:
    name: Hermes beim Start aktualisieren
    description: Führt beim Add-on-Start hermes update aus.
  auto_update_webui:
    name: WebUI beim Start aktualisieren
    description: Holt die aktuelle WebUI vom offiziellen master-Branch.
  auto_configure_mcp:
    name: Home Assistant MCP einrichten
    description: Trägt den Home-Assistant-MCP-Endpunkt in Hermes ein.
  api_server_enabled:
    name: Hermes API Server
    description: Startet den authentifizierten API Server für JARVIS.
  api_server_key:
    name: Hermes API-Key
    description: Starker Schlüssel für die Hermes API; denselben Wert in JARVIS eintragen.
  desktop_backend_enabled:
    name: Verbindung mit Hermes Desktop
    description: Startet einen abgesicherten Hermes-serve-Server für die Desktop-App. Unter Netzwerk einen Host-Port für 9119/tcp eintragen.
  desktop_username:
    name: Desktop-Benutzername
    description: Benutzername für die Remote-Verbindung mit Hermes Desktop.
  desktop_password:
    name: Desktop-Passwort
    description: Passwort mit mindestens 16 Zeichen für Hermes Desktop. Nur im vertrauenswürdigen Heimnetz oder VPN verwenden.
  homeassistant_token:
    name: Home-Assistant-Token
    description: Optionaler eigener Token; leer verwendet den Supervisor-Token.
  watch_entities:
    name: Beobachtete Entities
    description: Liste von Home-Assistant-Entity-IDs für Hermes.
