configuration:
  timezone:
    name: Zeitzone
    description: IANA-Zeitzone für Hermes und geplante Aufgaben.
  enable_terminal:
    name: Setup-Terminal
    description: Terminal in der Hermes WebUI anzeigen.
  browser_enabled:
    name: Lokaler Browser mit Übernahme
    description: Nutzt Hermes Bot Screen mit persistentem Chromium und abgesichertem Webzugang unter Werkzeuge → Browser. Benötigt etwa 1–2 GB freien RAM.
  beeper_enabled:
    name: Beeper Linux Desktop
    description: Startet den vorhandenen persistenten Beeper-Client auf einem eigenen Bildschirm unter Werkzeuge → Beeper Linux. Anmeldung und Kontoverknüpfungen bleiben manuell.
  assistant_tools_enabled:
    name: Lokale Karten- und Wettertools
    description: Aktiviert Wegbeschreibungen, Entfernungen, Kartenlinks und Wetterkarten ohne API-Schlüssel oder zusätzliche Einrichtung.
  auto_update_agent:
    name: Hermes beim Start aktualisieren
    description: Führt beim Add-on-Start hermes update aus.
  auto_update_webui:
    name: WebUI beim Start aktualisieren
    description: Holt die aktuelle WebUI vom offiziellen master-Branch.
  auto_configure_mcp:
    name: Home Assistant MCP einrichten
    description: Trägt den Home-Assistant-MCP-Endpunkt in Hermes ein.
  api_server_enabled:
    name: Hermes API Server
    description: Startet den authentifizierten API Server für JARVIS.
  api_server_key:
    name: Hermes API-Key
    description: Starker Schlüssel für die Hermes API; denselben Wert in JARVIS eintragen.
  desktop_backend_enabled:
    name: Verbindung mit Hermes Desktop
    description: Startet einen abgesicherten Hermes-serve-Server für die Desktop-App. Unter Netzwerk einen Host-Port für 9119/tcp eintragen.
  desktop_username:
    name: Desktop-Benutzername
    description: Benutzername für die Remote-Verbindung mit Hermes Desktop.
  desktop_password:
    name: Desktop-Passwort
    description: Passwort mit mindestens 16 Zeichen für Hermes Desktop. Nur im vertrauenswürdigen Heimnetz oder VPN verwenden.
  homeassistant_token:
    name: Home-Assistant-Token
    description: Optionaler eigener Token; leer verwendet den Supervisor-Token.
  watch_entities:
    name: Beobachtete Entities
    description: Liste von Home-Assistant-Entity-IDs für Hermes.
  talk_enabled:
    name: JARVIS in Nextcloud Talk
    description: Aktiviert JARVIS für erlaubte lokale 1:1-Unterhaltungen.
  talk_url:
    name: Nextcloud-URL für beide Kontakte
    description: HTTPS-Basisadresse der Nextcloud, bei Bedarf mit Installationspfad.
  talk_username:
    name: JARVIS Nextcloud-Konto-ID
    description: Bestehende Anmelde-ID, inklusive Groß- und Kleinschreibung.
  talk_app_password:
    name: JARVIS App-Passwort
    description: App-Passwort des bestehenden Nextcloud-Kontos mit Dateizugriff.
  talk_allowed_users:
    name: Erlaubte Benutzer für JARVIS
    description: Exakte Nextcloud-Konto-IDs der erlaubten Absender.
  talk_allowed_rooms:
    name: Erlaubte Talk-Räume für JARVIS
    description: Optionale Raumtokens. Leer erlaubt alle lokalen 1:1-Räume mit erlaubten Benutzern.
  talk_piper_endpoint:
    name: Wyoming-Piper-Endpunkt für beide Kontakte
    description: Interne Adresse tcp://host:port. Leer aktiviert Textbetrieb.
  talk_calls_enabled:
    name: Live-Anrufe für JARVIS und FRIDAY
    description: Nimmt bei aktivierten Kontakten erlaubte Anrufe mit lokalem Whisper und Wyoming Piper an.
  talk_piper_voice:
    name: Deutsche Piper-Stimme für JARVIS
    description: Exakter Stimmname des Wyoming-Dienstes, zum Beispiel de_DE-thorsten-medium.
  talk_friday_enabled:
    name: FRIDAY in Nextcloud Talk
    description: Aktiviert FRIDAY als eigenen Kontakt. Standardmäßig aus.
  talk_friday_username:
    name: FRIDAY Nextcloud-Konto-ID
    description: Eigene Konto-ID auf derselben Nextcloud-Instanz.
  talk_friday_app_password:
    name: FRIDAY App-Passwort
    description: Eigenes App-Passwort des FRIDAY-Kontos mit Dateizugriff.
  talk_friday_allowed_users:
    name: Erlaubte Benutzer für FRIDAY
    description: Exakte Konto-IDs. Eine leere Liste übernimmt die Benutzerliste von JARVIS.
  talk_friday_allowed_rooms:
    name: Erlaubte Talk-Räume für FRIDAY
    description: Optionale FRIDAY-Raumtokens. Leer erlaubt alle lokalen 1:1-Räume mit erlaubten Benutzern.
  talk_friday_piper_voice:
    name: Deutsche Piper-Stimme für FRIDAY
    description: Exakter Stimmname des Wyoming-Dienstes, zum Beispiel de_DE-eva_k-x_low.
