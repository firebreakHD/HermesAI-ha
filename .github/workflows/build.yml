name: Build and publish Home Assistant add-on

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "hermes_assistant/**"
      - "RELEASE_VERSION"
      - "repository.yaml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check staged release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare staged and published versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < RELEASE_VERSION)
          published=$(sed -n 's/^version: *"\([^"]*\)"/\1/p' hermes_assistant/config.yaml)
          docker_default=$(sed -n 's/^ARG BUILD_VERSION=//p' hermes_assistant/Dockerfile)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$published" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$docker_default" = "$published"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if dpkg --compare-versions "$version" gt "$published"; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          elif [ "$version" = "$published" ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Version $version is already published."
          else
            echo "Staged version $version is older than published version $published" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base-debian:bookworm
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base-debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'aarch64'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: hermes_assistant
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/firebreakhd/${{ matrix.arch }}-hermes-assistant:${{ needs.prepare.outputs.version }}
            ghcr.io/firebreakhd/${{ matrix.arch }}-hermes-assistant:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          provenance: false
          sbom: false

  publish:
    name: Publish add-on version to Home Assistant
    needs: [prepare, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Confirm both images are publicly available
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 aarch64; do
            image="ghcr.io/firebreakhd/${arch}-hermes-assistant:${VERSION}"
            available=false
            for attempt in 1 2 3 4 5; do
              if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                available=true
                break
              fi
              sleep 10
            done
            if [ "$available" != true ]; then
              echo "::error::$image is not anonymously pullable. Keep both GHCR packages public."
              exit 1
            fi
            echo "$image is anonymously pullable."
          done

      - name: Expose the version after image publication
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'main changed during the build; a newer workflow run must publish the version.' >&2
            exit 1
          fi
          sed -i -E "s/^(version: )\"[^\"]+\"/\1\"${VERSION}\"/" hermes_assistant/config.yaml
          sed -i -E "s/^(ARG BUILD_VERSION=)[^[:space:]]+/\1${VERSION}/" hermes_assistant/Dockerfile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hermes_assistant/config.yaml hermes_assistant/Dockerfile
          git commit -m "Publish Hermes Assistant ${VERSION} [skip ci]"
          git push origin HEAD:main
